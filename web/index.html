<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#140e0b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="A fullscreen Black history screensaver that slowly paints sourced facts and imagery."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Black History" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="128x128" href="/icons/icon-128.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Black History — Live Reveal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;0,7..72,700;1,7..72,400;1,7..72,500&family=Sora:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/overlay/overlay.css" />
    <link rel="stylesheet" href="/screensaver.css" />
  </head>
  <body class="screensaver">
    <div id="overlay-root">
      <div id="paint-container"></div>
      <aside id="reveal-hud" hidden aria-live="polite">
        <div class="reveal-melanin-bar" aria-hidden="true"></div>
        <header class="reveal-hud-header">
          <button
            type="button"
            class="reveal-hud-toggle"
            id="reveal-hud-toggle"
            aria-expanded="true"
            aria-controls="reveal-hud-body"
          >
            <span class="reveal-progress" id="reveal-progress">Discovery 1/10</span>
            <span class="reveal-timer" id="reveal-timer">LIVE</span>
            <span class="reveal-chevron" aria-hidden="true"></span>
          </button>
        </header>
        <div class="reveal-hud-body" id="reveal-hud-body">
          <p class="reveal-kicker">Black History</p>
          <p class="reveal-headline" id="reveal-headline">Loading…</p>
          <p class="reveal-subtitle" id="reveal-subtitle">
            Facts uncover slowly — sit back and watch
          </p>
          <p class="reveal-fact" id="reveal-fact" hidden></p>
          <div class="reveal-clues" id="reveal-clues"></div>
          <p class="reveal-attribution" id="reveal-attribution">
            Image credit loads with each discovery
          </p>
        </div>
      </aside>
    </div>

    <div id="boot-screen" class="boot-screen" role="status">
      <div class="boot-melanin" aria-hidden="true"></div>
      <p class="boot-kicker">Black History</p>
      <h1 class="boot-title">Live Reveal</h1>
      <p class="boot-copy">A slow watercolor uncover of sourced Black history facts.</p>
      <p class="boot-status" id="boot-status">Preparing the first discovery…</p>
      <div class="boot-actions">
        <button type="button" class="boot-btn" id="btn-enter">Enter fullscreen</button>
        <button type="button" class="boot-btn boot-btn-ghost" id="btn-install" hidden>
          Install on this screen
        </button>
      </div>
      <p class="boot-hint">Runs continually. Tap the corners to show controls.</p>
    </div>

    <div id="chrome-bar" class="chrome-bar" hidden>
      <button type="button" class="chrome-btn" id="btn-fullscreen">Fullscreen</button>
      <button type="button" class="chrome-btn" id="btn-pause">Pause</button>
      <button type="button" class="chrome-btn" id="btn-skip">Next layer</button>
      <button type="button" class="chrome-btn" id="btn-next">Next discovery</button>
    </div>

    <script src="/lib/p5.min.js"></script>
    <script type="module" src="/screensaver.js?v=20261102d"></script>
  </body>
</html>
