<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint Pomodoro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <h1 class="title">Paint Pomodoro</h1>
        <p class="phase-label" id="phase-label">Ready</p>
      </header>

      <section class="timer-section" aria-live="polite">
        <div class="timer" id="timer">25:00</div>
        <p class="timer-hint" id="timer-hint">Start a focus session when you're ready.</p>
      </section>

      <section class="controls">
        <button type="button" class="btn btn-primary" id="btn-primary">Start focus</button>
        <button type="button" class="btn btn-secondary" id="btn-secondary" hidden>Reset</button>
      </section>

      <section class="artwork-section" aria-live="polite">
        <button
          type="button"
          class="artwork-section-toggle"
          id="artwork-toggle"
          aria-expanded="true"
          aria-controls="artwork-body"
        >
          <div class="section-heading">
            <h2>Today's painting</h2>
            <span class="badge" id="artwork-badge">The Met</span>
          </div>
          <span class="artwork-chevron" aria-hidden="true"></span>
        </button>
        <div class="artwork-body" id="artwork-body">
          <p class="artwork-title" id="artwork-title">Loading…</p>
          <div class="artwork-clues" id="artwork-clues" hidden></div>
          <p class="artwork-progress">Canvas: <span id="daily-break-count">0</span>/10 breaks</p>
        </div>
      </section>

      <section class="controls-secondary">
        <button type="button" class="btn btn-activate" id="btn-activate">Activate next break</button>
      </section>

      <section class="tasks-section">
        <div class="section-heading">
          <h2>Today's tasks</h2>
          <span class="badge">Coming soon</span>
        </div>
        <ul class="task-list" id="task-list">
          <li class="task-placeholder">Task list will live here.</li>
        </ul>
      </section>

      <footer class="footer">
        <span class="version">v0.3.0</span>
      </footer>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
