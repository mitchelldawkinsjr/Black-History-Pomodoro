<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint Pomodoro Overlay</title>
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="overlay-root">
      <div id="paint-container"></div>
      <aside id="reveal-hud" hidden aria-live="polite">
        <header class="reveal-hud-header">
          <button
            type="button"
            class="reveal-hud-toggle"
            id="reveal-hud-toggle"
            aria-expanded="true"
            aria-controls="reveal-hud-body"
          >
            <span class="reveal-progress" id="reveal-progress">Break 1 of 10</span>
            <span class="reveal-timer" id="reveal-timer">05:00</span>
            <span class="reveal-chevron" aria-hidden="true"></span>
          </button>
        </header>
        <div class="reveal-hud-body" id="reveal-hud-body">
          <p class="reveal-headline" id="reveal-headline"></p>
          <div class="reveal-clues" id="reveal-clues"></div>
          <p class="reveal-attribution">Courtesy of The Metropolitan Museum of Art</p>
        </div>
      </aside>
    </div>
    <script src="../lib/p5.min.js"></script>
    <script type="module" src="overlay.js"></script>
  </body>
</html>
